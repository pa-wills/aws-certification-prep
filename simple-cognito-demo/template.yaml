# Demonstrator Cognito-powered web app.
# Gleefully generated by ChatGPT and adapted thereafter.

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Minimal Cognito User Pool + S3 static website demonstrator with CloudFront for HTTPS.

Resources:

  ### S3 BUCKET ###
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"


  ### COGNITO USER POOL ###
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cognito-demo-user-pool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  ### USER POOL CLIENT (SPA) ###
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: cognito-demo-spa-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub 'https://${SiteDistribution.DomainName}'
      LogoutURLs:
        - !Sub 'https://${SiteDistribution.DomainName}'
      SupportedIdentityProviders:
        - COGNITO

  ### COGNITO DOMAIN ###
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub 'demo${AWS::AccountId}${AWS::Region}'

  ### LAMBDA ROLE FOR CUSTOM RESOURCE ###
  IndexUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UploadIndexHtml
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${SiteBucket.Arn}/index.html'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  ### LAMBDA FUNCTION ###
  IndexUploaderFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt IndexUploaderRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib3

          s3 = boto3.client('s3')
          http = urllib3.PoolManager()

          def send_response(event, context, status, data=None):
              response_url = event['ResponseURL']
              body = {
                  'Status': status,
                  'Reason': f'See CloudWatch Logs: {context.log_stream_name}',
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }
              encoded = json.dumps(body).encode('utf-8')
              http.request('PUT', response_url, body=encoded, headers={
                  'content-type': '',
                  'content-length': str(len(encoded))
              })

          def handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      bucket = event['ResourceProperties']['BucketName']
                      user_pool_domain = event['ResourceProperties']['CognitoDomain']
                      client_id = event['ResourceProperties']['ClientId']
                      region = event['ResourceProperties']['Region']
                      index_url = event['ResourceProperties']['IndexHtmlUrl']

                      response = http.request('GET', index_url)
                      html = response.data.decode('utf-8')
                      html = html.replace('__COGNITO_DOMAIN__', user_pool_domain)
                      html = html.replace('__CLIENT_ID__', client_id)
                      html = html.replace('__REGION__', region)

                      s3.put_object(
                          Bucket=bucket,
                          Key='index.html',
                          Body=html,
                          ContentType='text/html'
                      )

                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  print(e)
                  send_response(event, context, 'FAILED')

  ### CUSTOM RESOURCE ###
  UploadIndexHtml:
    Type: Custom::UploadIndexHtml
    DependsOn:
      - SiteBucket
      - UserPoolClient
      - UserPoolDomain
    Properties:
      ServiceToken: !GetAtt IndexUploaderFunction.Arn
      BucketName: !Ref SiteBucket
      CognitoDomain: !Ref UserPoolDomain
      ClientId: !Ref UserPoolClient
      Region: !Ref AWS::Region
      IndexHtmlUrl: 'https://raw.githubusercontent.com/pa-wills/aws-certification-prep/refs/heads/dev/simple-cognito-demo/index.html' # HACK.

  ### CLOUDFRONT DISTRIBUTION ###
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.DomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: {} # This really shouldn't be necessary.... But....
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: DemoOAC
        Description: "Allow CloudFront to access private S3 bucket"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

Outputs:
  WebsiteURL:
    Description: CloudFront HTTPS URL for the SPA
    Value: !Sub 'https://${SiteDistribution.DomainName}'

  CognitoHostedUI:
    Description: Cognito Hosted UI base URL
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'

  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

