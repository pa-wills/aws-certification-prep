# Demonstrator Cognito-powered web app.
# Gleefully generated by ChatGPT and adapted thereafter.

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Minimal Cognito User Pool + S3 static website demonstrator.
  Auth via Cognito Hosted UI (OAuth2 Authorization Code Grant).
  Uses a custom Lambda resource to fetch index.html from an external URL.

Parameters:
  IndexHtmlUrl:
    Type: String
    Description: HTTPS URL to the external index.html file

Resources:

  ### S3 STATIC WEBSITE ###
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'

  ### COGNITO USER POOL ###
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cognito-demo-user-pool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  ### USER POOL CLIENT (SPA) ###
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: cognito-demo-spa-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub 'http://${SiteBucket.WebsiteURL}'
      LogoutURLs:
        - !Sub 'http://${SiteBucket.WebsiteURL}'
      SupportedIdentityProviders:
        - COGNITO

  ### COGNITO DOMAIN ###
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'cognito-demo-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  ### LAMBDA ROLE FOR CUSTOM RESOURCE ###
  IndexUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UploadIndexHtml
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${SiteBucket.Arn}/index.html'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  ### LAMBDA FUNCTION ###
  IndexUploaderFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt IndexUploaderRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib3

          s3 = boto3.client('s3')
          http = urllib3.PoolManager()

          def send_response(event, context, status, data=None):
              response_url = event['ResponseURL']
              body = {
                  'Status': status,
                  'Reason': f'See CloudWatch Logs: {context.log_stream_name}',
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }
              encoded = json.dumps(body).encode('utf-8')
              http.request('PUT', response_url, body=encoded, headers={
                  'content-type': '',
                  'content-length': str(len(encoded))
              })

          def handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      bucket = event['ResourceProperties']['BucketName']
                      user_pool_domain = event['ResourceProperties']['CognitoDomain']
                      client_id = event['ResourceProperties']['ClientId']
                      region = event['ResourceProperties']['Region']
                      index_url = event['ResourceProperties']['IndexHtmlUrl']

                      response = http.request('GET', index_url)
                      html = response.data.decode('utf-8')
                      html = html.replace('__COGNITO_DOMAIN__', user_pool_domain)
                      html = html.replace('__CLIENT_ID__', client_id)
                      html = html.replace('__REGION__', region)

                      s3.put_object(
                          Bucket=bucket,
                          Key='index.html',
                          Body=html,
                          ContentType='text/html'
                      )

                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  print(e)
                  send_response(event, context, 'FAILED')

  ### CUSTOM RESOURCE ###
  UploadIndexHtml:
    Type: Custom::UploadIndexHtml
    DependsOn:
      - SiteBucket
      - UserPoolClient
      - UserPoolDomain
    Properties:
      ServiceToken: !GetAtt IndexUploaderFunction.Arn
      BucketName: !Ref SiteBucket
      CognitoDomain: !Ref UserPoolDomain
      ClientId: !Ref UserPoolClient
      Region: !Ref AWS::Region
      IndexHtmlUrl: !Ref IndexHtmlUrl

Outputs:
  WebsiteURL:
    Description: S3 static website URL
    Value: !Sub 'http://${SiteBucket.WebsiteURL}'

  CognitoHostedUI:
    Description: Cognito Hosted UI base URL
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'

  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

