# Demonstrator Glue-based pipeline app.
# Gleefully generated by ChatGPT and adapted thereafter.

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Glue learning stack with Iris dataset:
  - S3 bucket
  - Seed CSV + ETL script via Lambda
  - Glue database
  - Glue crawler
  - Glue ETL job (CSV → Parquet)

Parameters:
  SampleCsvUrl:
    Type: String
    Default: https://raw.githubusercontent.com/uiuc-cse/data-fa14/gh-pages/data/iris.csv
    Description: Public Iris CSV for the demo

Resources:

  ############################################################
  # S3 BUCKET
  ############################################################
  GlueDemoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub glue-demo-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ############################################################
  # LAMBDA ROLE (DATA SEEDING)
  ############################################################
  SeedLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SeedS3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${GlueDemoBucket.Arn}/*

  ############################################################
  # LAMBDA FUNCTION (CUSTOM RESOURCE)
  ############################################################
  SeedDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.9
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt SeedLambdaRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref GlueDemoBucket
          CSV_URL: !Ref SampleCsvUrl
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          import os
          import urllib3

          s3 = boto3.client('s3')

          def send(event, context, status):
              response = {
                  "Status": status,
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Reason": "See CloudWatch logs"
              }
              http = urllib3.PoolManager()
              http.request(
                  "PUT",
                  event["ResponseURL"],
                  body=json.dumps(response),
                  headers={"Content-Type": "application/json"}
              )

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      # Always succeed on delete
                      send(event, context, "SUCCESS")
                      return

                  bucket = os.environ["BUCKET"]
                  csv_url = os.environ["CSV_URL"]

                  # Download CSV
                  csv_data = urllib.request.urlopen(csv_url).read()
                  s3.put_object(
                      Bucket=bucket,
                      Key="input/iris.csv",
                      Body=csv_data
                  )

                  # Glue ETL script
                  etl_script = '''
          import sys
          from awsglue.transforms import *
          from awsglue.utils import getResolvedOptions
          from awsglue.context import GlueContext
          from pyspark.context import SparkContext
          from awsglue.job import Job

          args = getResolvedOptions(sys.argv, ['JOB_NAME', 'SOURCE_TABLE'])

          sc = SparkContext()
          glueContext = GlueContext(sc)
          spark = glueContext.spark_session
          job = Job(glueContext)
          job.init(args['JOB_NAME'], args)

          source = glueContext.create_dynamic_frame.from_catalog(
              database="glue_demo_db",
              table_name=args['SOURCE_TABLE']
          )

          glueContext.write_dynamic_frame.from_options(
              frame=source,
              connection_type="s3",
              connection_options={"path": "s3://%s/output/"} ,
              format="parquet"
          )

          job.commit()
                  ''' % bucket

                  s3.put_object(
                      Bucket=bucket,
                      Key="scripts/glue_job.py",
                      Body=etl_script.encode("utf-8")
                  )

                  send(event, context, "SUCCESS")
              except Exception as e:
                  print(str(e))
                  send(event, context, "FAILED")

  ############################################################
  # CUSTOM RESOURCE
  ############################################################
  SeedData:
    Type: Custom::SeedData
    Properties:
      ServiceToken: !GetAtt SeedDataFunction.Arn

  ############################################################
  # GLUE ROLE
  ############################################################
  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${GlueDemoBucket.Arn}/*

  ############################################################
  # GLUE DATABASE
  ############################################################
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: glue_demo_db

  ############################################################
  # GLUE CRAWLER
  ############################################################
  GlueCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: glue-demo-crawler
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${GlueDemoBucket}/input/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  ############################################################
  # GLUE JOB
  ############################################################
  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: glue-demo-job
      Role: !GetAtt GlueRole.Arn
      GlueVersion: '3.0'
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${GlueDemoBucket}/scripts/glue_job.py
        PythonVersion: '3'
      DefaultArguments:
        --job-language: python
        --SOURCE_TABLE: input
        --TempDir: !Sub s3://${GlueDemoBucket}/temp/

Outputs:
  Bucket:
    Value: !Ref GlueDemoBucket
  Database:
    Value: !Ref GlueDatabase
  Crawler:
    Value: !Ref GlueCrawler
  Job:
    Value: !Ref GlueJob


