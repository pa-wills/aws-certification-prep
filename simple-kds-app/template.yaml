# Demonstrator KDS app with simple lambda producer (timed with EBridge) and consumer (mapped to event source).
# Gleefully generated by ChatGPT and adpated thereafter.

AWSTemplateFormatVersion: "2010-09-09"
Description: Simple Kinesis Data Streams demo with Lambda producer and consumer

Resources:

  UserEventsStream:
    Type: AWS::Kinesis::Stream
    Properties:
      ShardCount: 1
      RetentionPeriodHours: 24

  ProducerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KinesisPutPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                Resource: !GetAtt UserEventsStream.Arn

  ProducerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kds-producer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ProducerLambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          STREAM_NAME: !Ref UserEventsStream
      Code:
        ZipFile: |
          import json
          import boto3
          import datetime
          import os
          import random

          kinesis = boto3.client("kinesis")

          def handler(event, context):
              for i in range(10):
                  user_id = f"user-{random.randint(1,5)}"
                  payload = {
                      "user_id": user_id,
                      "event_type": "login",
                      "timestamp": datetime.datetime.utcnow().isoformat()
                  }

                  kinesis.put_record(
                      StreamName = os.environ["STREAM_NAME"],
                      Data = json.dumps(payload),
                      PartitionKey = user_id
                  )

              return {"status": "ok"}

  ProducerSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      Targets:
        - Arn: !GetAtt ProducerLambda.Arn
          Id: ProducerLambdaTarget

  ProducerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProducerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProducerSchedule.Arn

  ConsumerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KinesisReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:ListStreams
                Resource: !GetAtt UserEventsStream.Arn

  ConsumerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kds-consumer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ConsumerLambdaRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import base64
          import json

          def handler(event, context):
              for record in event["Records"]:
                  raw_payload = base64.b64decode(record["kinesis"]["data"])
                  payload = json.loads(raw_payload)
                  print("PartitionKey:", record["kinesis"]["partitionKey"])
                  print("SequenceNumber:", record["kinesis"]["sequenceNumber"])
                  print("Payload:", payload)

  KinesisEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt UserEventsStream.Arn
      FunctionName: !Ref ConsumerLambda
      StartingPosition: TRIM_HORIZON
      BatchSize: 100
      Enabled: true
