# TODO: remove, as this is no longer required.

version: 0.2

env:
  variables:
    IMAGE_NAME: reinvent-pipeline-base
    ECR_REPO: 177738943897.dkr.ecr.ap-southeast-2.amazonaws.com/reinvent-pipeline-base:latest #TODO need to parameterize.
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
      - echo Build started on `date`
  build:
    commands:
      - pwd
      - ls -la
      - echo Building the Docker image for ARM64...
      - docker buildx create --use || true
      - docker buildx build --platform linux/arm64 --build-arg DEBIAN_FRONTEND=noninteractive --file reinvent-pipeline/Dockerfile-base -t $ECR_REPO --push reinvent-pipeline/
      - echo Build completed.
