AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate pipeline for processing re:Invent videos.
  Downloads video, generates VTT, chunks text, summarizes chunks via LLM, writes to S3.

Parameters:
  DockerImageArn:
    Type: String
    Description: ARN of the Docker image in ECR to use for the ECS task

Resources:

  # S3 bucket for output
  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
#      BucketName: !Ref OutputBucketName
      VersioningConfiguration:
        Status: Enabled

  # ECS Cluster
  VideoPipelineCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: reinvent-video-pipeline

  # IAM role for ECS task
  VideoPipelineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reinvent-pipeline-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ContainerBasicStuff
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:GetAuthorizationToken"
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:BatchGetImage"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:InitiateLayerUpload"
                  - "ecr:UploadLayerPart"
                  - "ecr:CompleteLayerUpload"
                  - "ecr:PutImage"
                  - "logs:CreateLogStream"
                  - "logs:CreateLogGroup"
                  - "logs:PutLogEvents"
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess


  # ECS Task Definition
  VideoPipelineTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: reinvent-pipeline-task
      Cpu: '512'               # adjust as needed
      Memory: '1024'           # adjust as needed
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt VideoPipelineTaskRole.Arn
      TaskRoleArn: !GetAtt VideoPipelineTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: video-pipeline
          Image: !Ref DockerImageArn
          Command: ["AWS reInvent 2025 - How well do you know EC2 (CMP356).vtt"]
          Essential: true
          Environment:
            - Name: OUTPUT_BUCKET
              Value: !Ref PipelineOutputBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/reinvent-pipeline
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ecs


  StateMachinec98d7906:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: StateMachinec98d7906v2
      RoleArn: !GetAtt Rolef62bfde7.Arn
      DefinitionString: !Sub |
        {
          "Comment": "A description of my state machine",
          "StartAt": "ValidateInput",
          "States": {
            "ValidateInput": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.videoS3Key",
                  "IsPresent": true,
                  "Next": "WaitForVTT"
                }
              ],
              "Default": "FailMissingKey"
            },
            "FailMissingKey": {
              "Type": "Fail",
              "Error": "MissingVideoKey",
              "Cause": "videoS3Key must be provided to start workflow"
            },
            "WaitForVTT": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Parameters": {
                "FunctionName": "blah",
                "Payload": {
                  "Token.$": "$$.Task.Token",
                  "VideoS3Key.$": "$.videoS3Key"
                }
              },
              "TimeoutSeconds": 86400,
              "HeartbeatSeconds": 300,
              "End": true
            }
          }
        }
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
#      DefinitionSubstitutions:
#        WaitForVTTStubFunctionArn: blah

  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/stepfunctions/VideoPipeline
      RetentionInDays: 14

  Rolef62bfde7:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StepFunctions_IAM_ROLE_Reinvent-ML-Processord7743e0b
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600

  Policy77867654:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: XRayAccessPolicy6418b98c
      RoleName:
        Ref: Rolef62bfde7
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource:
              - '*'

  Policyc1eef3f3:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: LambdaInvokeScopedAccessPolicyb273a0d1
      RoleName:
        Ref: Rolef62bfde7
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - >-
                arn:aws:lambda:ap-southeast-2:177738943897:function:WaitForVTTStub:*
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - >-
                arn:aws:lambda:ap-southeast-2:177738943897:function:WaitForVTTStub

  StepFunctionsLoggingPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: StepFunctionsLoggingPolicy
      RoleName:
        Ref: Rolef62bfde7
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"


  WaitForVTTStubFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: WaitForVTTStub
      Runtime: python3.9
      Handler: index.handler
      Code: 
        ZipFile: |
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            """
            Stub Lambda for Step Functions WaitForVTT.
            Simply logs the task token and input payload.
            """
            logger.info("Received WaitForVTT event:")
            logger.info(json.dumps(event))

            token = event.get("token")
            if token:
                logger.info(f"Callback token: {token}")
            else:
                logger.warning("No task token found in event payload.")

            # Return payload as-is; workflow remains paused until token is used
            return event
      Timeout: 300
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WaitForVTTStubRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole



Outputs:
  ECSClusterName:
    Description: Name of ECS cluster
    Value: !Ref VideoPipelineCluster
  ECSVideoPipelineTaskRole:
    Description: IAM Role ARN used by ECS tasks
    Value: !GetAtt VideoPipelineTaskRole.Arn
  PipelineOutputBucket:
    Description: S3 bucket for storing chunks and summaries
    Value: !Ref PipelineOutputBucket
