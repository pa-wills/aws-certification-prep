AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  From VTTs, chunks text, summarizes chunks via LLM, writes to S3.

Resources:

  # S3 bucket for output
  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled



  StateMachinec98d7906:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: StateMachinec98d7906v2
      RoleArn: !GetAtt Rolef62bfde7.Arn
      DefinitionString: !Sub |
        {
          "Comment": "A description of my state machine",
          "StartAt": "ValidateInput",
          "States": {
            "ValidateInput": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.videoS3Key",
                  "IsPresent": true,
                  "Next": "WaitForVTT"
                }
              ],
              "Default": "FailMissingKey"
            },
            "FailMissingKey": {
              "Type": "Fail",
              "Error": "MissingVideoKey",
              "Cause": "videoS3Key must be provided to start workflow"
            },
            "WaitForVTT": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Parameters": {
                "FunctionName": "blah",
                "Payload": {
                  "Token.$": "$$.Task.Token",
                  "VideoS3Key.$": "$.videoS3Key"
                }
              },
              "TimeoutSeconds": 86400,
              "HeartbeatSeconds": 300,
              "End": true
            }
          }
        }
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
#      DefinitionSubstitutions:
#        WaitForVTTStubFunctionArn: blah

  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/stepfunctions/VideoPipeline
      RetentionInDays: 14

  Rolef62bfde7:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StepFunctions_IAM_ROLE_Reinvent-ML-Processord7743e0b
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600

  Policy77867654:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: XRayAccessPolicy6418b98c
      RoleName:
        Ref: Rolef62bfde7
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource:
              - '*'

  Policyc1eef3f3:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: LambdaInvokeScopedAccessPolicyb273a0d1
      RoleName:
        Ref: Rolef62bfde7
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - >-
                arn:aws:lambda:ap-southeast-2:177738943897:function:WaitForVTTStub:*
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - >-
                arn:aws:lambda:ap-southeast-2:177738943897:function:WaitForVTTStub

  StepFunctionsLoggingPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: StepFunctionsLoggingPolicy
      RoleName:
        Ref: Rolef62bfde7
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"

  WaitForVTTStubFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: WaitForVTTStub
      Runtime: python3.9
      Handler: index.handler
      Code: 
        ZipFile: |
          import json
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
            """
            Stub Lambda for Step Functions WaitForVTT.
            Simply logs the task token and input payload.
            """
            logger.info("Received WaitForVTT event:")
            logger.info(json.dumps(event))

            token = event.get("token")
            if token:
                logger.info(f"Callback token: {token}")
            else:
                logger.warning("No task token found in event payload.")

            # Return payload as-is; workflow remains paused until token is used
            return event
      Timeout: 300
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WaitForVTTStubRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ProduceChunksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: 
      Handler: produceChunks.lambda_handler
      Role: !GetAtt ProduceChunksFunctionExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024

  ProduceChunksFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManipulateDataFoldersForProducingChunks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:get*"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_2_ transcriptions/*"
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_2_ transcriptions/"
              - Effect: Allow
                Action:
                  - "s3:put*"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_3_ chunks/*"
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_3_ chunks/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ProduceSummarisedChunksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: 
      Handler: produceSummarisedChunks.lambda_handler
      Role: !GetAtt ProduceSummarisedChunksFunctionExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024

  ProduceSummarisedChunksFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManipulateDataFoldersForProducingSummarisedChunks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:get*"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_3_ chunks/*"
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_3_ chunks/"
              - Effect: Allow
                Action:
                  - "s3:put*"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_4_ summarised chunks/*"
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_4_ summarised chunks/"
        - PolicyName: InvokeNovaModelsForProducingSummarisedChunks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                Resource: 
                  - "arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-micro*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ProduceSummariesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: 
      Handler: produceSummaries.lambda_handler
      Role: !GetAtt ProduceSummariesFunctionExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024

  ProduceSummariesFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManipulateDataFoldersForProducingSummaries
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_4_ summarised chunks/*"
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_4_ summarised chunks/"
              - Effect: Allow
                Action:
                  - "s3:ListBucket"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp" # Specify the bucket exactly, or suffer 403s...
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                Resource: 
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_5_ summaries/*"
                  - "arn:aws:s3:::reinvent-ml-pipeline-temp/_5_ summaries/"
        - PolicyName: InvokeNovaModelsForProducingSummaries
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource: 
                  - "arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

