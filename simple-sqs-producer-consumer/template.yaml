AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Parameters:
  QueueDelaySecondsParameter:
    Default: 0
    Type: Number
  QueueMessageRetentionPeriodParameter:
    Default: 345600
    Type: Number
  QueueVisibilityTimeoutParameter:
    Default: 30
    Type: Number
  ScheduleProducerPeriodicityParameter:
    Default: "rate(10 minutes)"
    Type: String

Resources:
  MyQueue:
    Type: AWS::SQS::Queue
    Properties: 
      DelaySeconds:
        Ref: QueueDelaySecondsParameter
      MessageRetentionPeriod: 
        Ref: QueueMessageRetentionPeriodParameter
      ReceiveMessageWaitTimeSeconds: 0
      VisibilityTimeout: 
        Ref: QueueVisibilityTimeoutParameter

  MyTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      AttributeDefinitions:
        - AttributeName: "DateTime"
          AttributeType: "S"
      BillingMode: "PAY_PER_REQUEST"
      KeySchema:
        - AttributeName: "DateTime"
          KeyType: "HASH"
      TimeToLiveSpecification:
        AttributeName: "ttl"
        Enabled: true

  # Lambdas
  LambdaProducer:
    Type: AWS::Serverless::Function
    DependsOn: LambdaServiceRole
    Properties:
      Handler: producer.lambda_handler
      CodeUri: .
      Description: 'The producer function'  
      Environment:
        Variables:
          queueRef: !Ref MyQueue
      Events:
        ProducerScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleProducerPeriodicityParameter
      Layers:
        - !Ref LayerXRay
      MemorySize: 256
      Role: !GetAtt LambdaServiceRole.Arn
      Runtime: python3.9
      Timeout: 5
      Tracing: Active

  LambdaConsumer:
    Type: AWS::Serverless::Function
    DependsOn: LambdaServiceRole
    Properties:
      Handler: consumer.lambda_handler
      CodeUri: .
      Description: 'The consumer function'
      Environment:
        Variables:
          tableRef: !Ref MyTable
      Events:
        # https://aws.amazon.com/blogs/aws/aws-lambda-adds-amazon-simple-queue-service-to-supported-event-sources/?utm_source=feedburner&utm_medium=feed&utm_campaign=Feed%3A+AmazonWebServicesBlog+%28Amazon+Web+Services+Blog%29
        # Attempt to use a direct Event binding, rather than Eventbridge.
        ConsumerSQSEvent:
          Type: "SQS"
          Properties:
            BatchSize: 1
            Queue: !GetAtt MyQueue.Arn
      Layers:
        - !Ref LayerXRay
      MemorySize: 256
      Role: !GetAtt LambdaServiceRole.Arn
      Runtime: python3.9
      Timeout: 5
      Tracing: Active

  LayerXRay:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: x-ray-lib
      Description: Dependencies for the x-ray SDK.
      # Make sure the layer file is built, and in the S3 bucket, or this won't work.
      ContentUri: "s3://simple-sqs-producer-consumer-store/x-ray-libs-339d85da-ea17-4a98-a207-18257d7e029c.zip"
      CompatibleRuntimes:
        - python3.9

  # Roles
  LambdaServiceRole:
    Type:  AWS::IAM::Role
    Properties:
      Description: Allows Lambda functions to call DyDB, SQS.
      Path: /
      # Unsure what this does?
      # https://devops.stackexchange.com/questions/5094/what-is-the-purpose-of-assumerolepolicydocument-in-iam/5099
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SNSRolePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:*'
                  - 'dynamodb:*'
                Resource: '*'
      ManagedPolicyArns:
        # Seems sloppy to explicitly refer to this. Hopefully the ARN is static.
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole" # Important. Gives Lambda perms to write to CWatch.
        - "arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess" # Important. Gives Lambda perms to write to X-Ray.




